<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews — Saffron House</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-bottom: 1.5rem; }
    .filter-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .filter-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .filter-select, .filter-input { height: 36px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 0.75rem; font-size: 0.875rem; background: var(--card); color: var(--text); }
    .review-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 0.875rem; }
    .review-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
    .review-stars { font-size: 1.125rem; letter-spacing: 1px; }
    .review-date { font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; }
    .review-order { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.375rem; }
    .review-comment { font-size: 0.9rem; color: var(--text); line-height: 1.6; }
    .no-reviews { text-align: center; padding: 3rem; color: var(--text-muted); }
    .stats-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat-pill { background: var(--primary-light); color: var(--primary); border-radius: 999px; padding: 0.375rem 1rem; font-size: 0.875rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="/logo.png" alt="Saffron House" style="height:38px;width:auto;max-width:150px;" />
      </div>
      <nav class="sidebar-nav">
        <a href="/admin" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="/admin/menu" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6h3v7"/></svg>
          Menu
        </a>
        <a href="/admin/tables" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v14"/><path d="M19 7v14"/><path d="M9 21h6"/></svg>
          Tables
        </a>
        <a href="/admin/reports" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M2 20h20"/></svg>
          Reports
        </a>
        <a href="/admin/reviews" class="sidebar-link active">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Reviews
        </a>
        <a href="/kitchen" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          Kitchen
        </a>
      </nav>
      <button class="sidebar-logout" onclick="logout('/admin/login')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </aside>

    <div class="admin-mobile-nav">
      <a href="/admin" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <small>Dashboard</small>
      </a>
      <a href="/admin/menu" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6h3v7"/></svg>
        <small>Menu</small>
      </a>
      <a href="/admin/tables" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v14"/><path d="M19 7v14"/><path d="M9 21h6"/></svg>
        <small>Tables</small>
      </a>
      <a href="/admin/reports" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M2 20h20"/></svg>
        <small>Reports</small>
      </a>
      <a href="/admin/reviews" class="mobile-nav-link active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <small>Reviews</small>
      </a>
    </div>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="admin-page-title">Customer Reviews</h1>
        <div style="display:flex;align-items:center;gap:0.625rem">
          <button class="notif-btn" id="notifBtnWaiter" onclick="toggleNotifPanel('waiter')" title="Waiter Calls">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-badge hidden" id="notifBadgeWaiter">0</span>
          </button>
          <button class="notif-btn" id="notifBtnCash" onclick="toggleNotifPanel('cash')" title="Cash Payments">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
            <span class="notif-badge hidden" id="notifBadgeCash">0</span>
          </button>
          <button class="btn btn-outline btn-sm" onclick="logout('/admin/login')">Sign Out</button>
        </div>
      </div>

      <div class="admin-content">
        <div class="filter-bar">
          <div class="filter-group">
            <label class="filter-label">Rating</label>
            <select class="filter-select" id="ratingFilter" onchange="loadReviews()">
              <option value="">All Ratings</option>
              <option value="5">⭐⭐⭐⭐⭐ (5)</option>
              <option value="4">⭐⭐⭐⭐ (4)</option>
              <option value="3">⭐⭐⭐ (3)</option>
              <option value="2">⭐⭐ (2)</option>
              <option value="1">⭐ (1)</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Table</label>
            <select class="filter-select" id="tableFilter" onchange="loadReviews()">
              <option value="">All Tables</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">From Date</label>
            <input type="date" class="filter-input" id="fromDate" onchange="loadReviews()" />
          </div>
          <div class="filter-group">
            <label class="filter-label">To Date</label>
            <input type="date" class="filter-input" id="toDate" onchange="loadReviews()" />
          </div>
          <button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear</button>
        </div>

        <div id="statsRow" class="stats-row"></div>
        <div id="reviewsList">
          <div class="card skeleton" style="height:100px;margin-bottom:0.875rem"></div>
          <div class="card skeleton" style="height:100px;margin-bottom:0.875rem"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/config.js"></script>
  <script src="/api-base.js"></script>
  <script src="/js/auth.js"></script>
  <script>requireAdminAuth();</script>
  <script src="/js/admin-notifications.js"></script>
  <script src="/js/admin-reviews.js"></script>
</body>
</html>
