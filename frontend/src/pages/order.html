<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Tracking — Saffron House</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .track-body { max-width: 520px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    .status-steps { display: flex; align-items: center; gap: 0; margin: 2rem 0; }
    .step-node { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
    .step-node:not(:last-child)::after { content:''; position: absolute; top: 14px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
    .step-node.done::after { background: var(--primary); }
    .step-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; position: relative; z-index: 1; color: var(--text-muted); }
    .step-node.done .step-circle { border-color: var(--primary); background: var(--primary); color: #fff; }
    .step-node.active .step-circle { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 700; animation: pulse 1.5s infinite; }
    .step-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.375rem; font-weight: 500; text-align: center; }
    .step-node.done .step-label, .step-node.active .step-label { color: var(--primary); }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

    .order-card { padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; }
    .order-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
    .order-num { font-size: 1.375rem; }
    .order-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    .order-items-list { border-top: 1px solid var(--border); padding-top: 0.75rem; }
    .order-line { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 0.375rem 0; }
    .order-line span:first-child { color: var(--text-muted); }
    .order-subtotal { border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.5rem; }
    .order-subtotal-line { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); padding: 0.2rem 0; }
    .order-total-line { display: flex; justify-content: space-between; font-weight: 700; font-size: 1rem; padding-top: 0.5rem; }

    .status-message { border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-size: 0.9375rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; }
    .refresh-hint { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 1rem; }

    .payment-success { display: flex; align-items: center; gap: 1rem; margin-top: 1rem; padding: 1rem; background: var(--secondary-light); border-radius: 12px; }
    .payment-success-icon { font-size: 1.5rem; flex-shrink: 0; }
    .payment-success-title { font-weight: 700; font-size: 0.9375rem; color: var(--secondary); }
    .payment-success-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

    .review-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .review-title { font-size: 1.0625rem; font-weight: 700; margin-bottom: 1rem; }
    .star-rating { display: flex; gap: 0.375rem; margin-bottom: 1rem; }
    .star-btn { font-size: 1.75rem; background: none; border: none; cursor: pointer; line-height: 1; padding: 0; transition: transform 0.1s; }
    .star-btn:hover { transform: scale(1.2); }
    .star-btn.active { filter: drop-shadow(0 0 4px rgba(250,190,60,0.6)); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-box { background: var(--card); border-radius: 16px; padding: 1.75rem; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .modal-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; }
    .modal-body { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .modal-actions { display: flex; gap: 0.75rem; }
    .hidden { display: none !important; }

    .pay-amount { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 1.25rem; color: var(--primary); }
    .pay-tabs { display: flex; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--border); margin-bottom: 1.25rem; }
    .pay-tab { flex: 1; padding: 0.625rem; border: none; background: var(--bg); font-size: 0.875rem; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: all 0.15s; }
    .pay-tab:not(:last-child) { border-right: 1.5px solid var(--border); }
    .pay-tab-active { background: var(--primary); color: #fff; }
    .pay-tab-content .form-group { margin-bottom: 0.875rem; }
    .pay-spinner-wrap { text-align: center; padding: 2rem 0; }
    .pay-spinner { width: 44px; height: 44px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .payment-waiting { display: flex; gap: 1rem; align-items: flex-start; padding: 1rem; background: #fffbeb; border-radius: 12px; border: 1px solid #fde68a; margin-top: 1rem; }
    .payment-waiting-icon { font-size: 1.5rem; flex-shrink: 0; }
    .payment-waiting-title { font-weight: 700; font-size: 0.9375rem; color: #92400e; }
    .payment-waiting-sub { font-size: 0.8rem; color: #78350f; margin-top: 0.2rem; }
    .cash-info { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; margin-bottom: 1.25rem; }
    .cash-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .cash-desc { font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <div class="page-header-title">
        <span>🧾</span>
        Order Tracking
      </div>
      <div id="tableLink"></div>
    </div>
  </header>

  <div class="track-body">
    <div id="content">
      <div class="skeleton" style="height:80px;margin-bottom:1rem;border-radius:16px"></div>
      <div class="skeleton" style="height:200px;border-radius:16px"></div>
    </div>
  </div>

  <!-- Payment Method Modal -->
  <div id="paymentModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
        <h2 class="modal-title" style="margin:0">Pay Your Bill</h2>
        <button class="btn-icon" onclick="closePaymentModal()">✕</button>
      </div>
      <div class="pay-amount" id="payModalTotal"></div>
      <div class="pay-tabs">
        <button class="pay-tab" id="payTab-upi" onclick="switchPayTab('upi')">UPI</button>
        <button class="pay-tab" id="payTab-card" onclick="switchPayTab('card')">Card</button>
        <button class="pay-tab" id="payTab-cash" onclick="switchPayTab('cash')">Cash</button>
      </div>

      <div id="payContent-upi" class="pay-tab-content hidden">
        <div class="form-group">
          <label class="form-label">UPI ID</label>
          <input class="form-input" id="upiId" type="text" placeholder="yourname@upi" autocomplete="off" />
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="simulatePay('upi')">Pay Now</button>
      </div>

      <div id="payContent-card" class="pay-tab-content hidden">
        <div class="form-group">
          <label class="form-label">Card Number</label>
          <input class="form-input" id="cardNumber" type="text" placeholder="1234 5678 9012 3456" maxlength="19" oninput="formatCardNumber(this)" />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
          <div class="form-group">
            <label class="form-label">Expiry</label>
            <input class="form-input" id="cardExpiry" type="text" placeholder="MM/YY" maxlength="5" oninput="formatExpiry(this)" />
          </div>
          <div class="form-group">
            <label class="form-label">CVV</label>
            <input class="form-input" id="cardCvv" type="password" placeholder="123" maxlength="3" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Name on Card</label>
          <input class="form-input" id="cardName" type="text" placeholder="Card Holder Name" />
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="simulatePay('card')">Pay Now</button>
      </div>

      <div id="payContent-cash" class="pay-tab-content hidden">
        <div class="cash-info">
          <div class="cash-icon">🛎️</div>
          <div style="font-weight:700;margin-bottom:0.375rem">Pay at the table</div>
          <div class="cash-desc">A waiter will come to your table to collect payment. Tap the button below to notify them.</div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="simulatePay('cash')">Request Cash Collection</button>
      </div>
    </div>
  </div>

  <!-- Payment Processing Overlay -->
  <div id="payProcessingModal" class="modal-backdrop hidden">
    <div class="modal-box" style="text-align:center;padding:2.5rem">
      <div class="pay-spinner"></div>
      <div style="font-weight:700;font-size:1rem;margin-bottom:0.375rem">Processing Payment…</div>
      <div style="font-size:0.875rem;color:var(--text-muted)">Please wait, do not close this page.</div>
    </div>
  </div>

  <!-- Cancel Confirmation Modal -->
  <div id="cancelModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-title">Cancel Order?</div>
      <div class="modal-body">Are you sure you want to cancel this order? This action cannot be undone.</div>
      <div class="modal-actions">
        <button class="btn btn-outline" style="flex:1" onclick="closeCancelModal()">Keep Order</button>
        <button class="btn btn-primary" id="confirmCancelBtn" style="flex:1;background:var(--destructive);border-color:var(--destructive)" onclick="cancelOrder()">Yes, Cancel Order</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/config.js"></script>
  <script src="/api-base.js"></script>
  <script src="/js/order.js"></script>
</body>
</html>
