<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Management — Saffron House</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .item-row { display: flex; align-items: center; gap: 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.875rem 1rem; margin-bottom: 0.5rem; }
    .item-row.unavailable { opacity: 0.55; }
    .item-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; background: var(--primary-light); }
    .item-thumb-placeholder { width: 48px; height: 48px; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
    .item-row-info { flex: 1; min-width: 0; }
    .item-row-name { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.9rem; }
    .item-row-desc { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-price { font-weight: 700; font-size: 0.9rem; color: var(--primary); flex-shrink: 0; }
    .item-actions { display: flex; gap: 0.375rem; flex-shrink: 0; }
    .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; transition: background 0.15s; }
    .icon-btn:hover { background: var(--primary-light); }
    .icon-btn.danger:hover { background: var(--destructive-light); }
    .cat-section { margin-bottom: 2rem; }
    .cat-heading { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .cat-count { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.875rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.375rem; }
    .checkboxes { display: flex; gap: 1.5rem; }
    .unavail-tag { font-size: 0.7rem; background: #f3f4f6; color: #6b7280; padding: 0.15rem 0.5rem; border-radius: 999px; }
    .img-preview { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: block; }
    .img-upload-wrap { display: flex; align-items: center; gap: 1rem; }
    .upload-btn { padding: 0.375rem 0.875rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 0.8rem; cursor: pointer; }
    .upload-btn:hover { background: var(--primary-light); }
    .upload-status { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="/logo.png" alt="Saffron House" style="height:38px;width:auto;max-width:150px;" />
      </div>
      <nav class="sidebar-nav">
        <a href="/admin" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="/admin/menu" class="sidebar-link active">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6h3v7"/></svg>
          Menu
        </a>
        <a href="/admin/tables" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v14"/><path d="M19 7v14"/><path d="M9 21h6"/></svg>
          Tables
        </a>
        <a href="/admin/reports" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M2 20h20"/></svg>
          Reports
        </a>
        <a href="/admin/reviews" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Reviews
        </a>
        <a href="/kitchen" class="sidebar-link">
          <svg class="sidebar-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          Kitchen
        </a>
      </nav>
      <button class="sidebar-logout" onclick="logout('/admin/login')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </aside>

    <div class="admin-mobile-nav">
      <a href="/admin" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <small>Dashboard</small>
      </a>
      <a href="/admin/menu" class="mobile-nav-link active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6h3v7"/></svg>
        <small>Menu</small>
      </a>
      <a href="/admin/tables" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v14"/><path d="M19 7v14"/><path d="M9 21h6"/></svg>
        <small>Tables</small>
      </a>
      <a href="/admin/reports" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M2 20h20"/></svg>
        <small>Reports</small>
      </a>
      <a href="/admin/reviews" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <small>Reviews</small>
      </a>
      <a href="/kitchen" class="mobile-nav-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        <small>Kitchen</small>
      </a>
    </div>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="admin-page-title">Menu Management</h1>
        <div style="display:flex;align-items:center;gap:0.625rem">
          <button class="notif-btn" id="notifBtnWaiter" onclick="toggleNotifPanel('waiter')" title="Waiter Calls">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-badge hidden" id="notifBadgeWaiter">0</span>
          </button>
          <button class="notif-btn" id="notifBtnCash" onclick="toggleNotifPanel('cash')" title="Cash Payments">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
            <span class="notif-badge hidden" id="notifBadgeCash">0</span>
          </button>
          <button class="btn btn-primary btn-sm" onclick="openAdd()">+ Add Item</button>
        </div>
      </div>

      <div class="admin-content">
        <div class="tab-bar" id="catFilter" style="margin-bottom:1.5rem"></div>
        <div id="menuBody">
          <div class="skeleton" style="height:64px;margin-bottom:0.5rem;border-radius:12px"></div>
          <div class="skeleton" style="height:64px;margin-bottom:0.5rem;border-radius:12px"></div>
          <div class="skeleton" style="height:64px;border-radius:12px"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Form Modal -->
  <div class="modal-overlay hidden" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Menu Item</h2>
        <button class="btn-icon" onclick="closeForm()">✕</button>
      </div>
      <form id="itemForm" onsubmit="submitForm(event)">
        <div class="modal-body" style="display:flex;flex-direction:column;gap:1rem">
          <div class="form-group">
            <label class="form-label" for="fCategory">Category</label>
            <select class="form-select" id="fCategory" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="fName">Name</label>
            <input class="form-input" id="fName" type="text" placeholder="Item name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="fDesc">Description</label>
            <textarea class="form-textarea" id="fDesc" placeholder="Optional description"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Item Image</label>
            <div class="img-upload-wrap">
              <img id="imgPreview" class="img-preview" src="" alt="Preview" style="display:none" />
              <div>
                <label class="upload-btn" for="fImageFile">📷 Choose Image</label>
                <input type="file" id="fImageFile" accept="image/*" style="display:none" onchange="handleImageSelect()" />
                <input type="hidden" id="fImageUrl" />
                <div class="upload-status" id="uploadStatus"></div>
              </div>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="fPrice">Price (₹)</label>
              <input class="form-input" id="fPrice" type="number" step="0.01" min="0" placeholder="0.00" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="fSort">Sort Order</label>
              <input class="form-input" id="fSort" type="number" value="0" />
            </div>
          </div>
          <div class="checkboxes">
            <label class="checkbox-label"><input type="checkbox" id="fVeg" /> 🌿 Vegetarian</label>
            <label class="checkbox-label"><input type="checkbox" id="fAvailable" checked /> Available</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" style="flex:1" onclick="closeForm()">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex:1" id="submitBtn">Add Item</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/config.js"></script>
  <script src="/api-base.js"></script>
  <script src="/js/auth.js"></script>
  <script>requireAdminAuth();</script>
  <script src="/js/admin-notifications.js"></script>
  <script src="/js/admin-menu.js"></script>
</body>
</html>
